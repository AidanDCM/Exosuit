name: Exosuit CI

# Triggers are deliberately non-overlapping. Pull requests validate pre-merge;
# pushes validate main after merge. Branch work without an open PR may use workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "apps/**"
      - "docs/**"
      - "scripts/**"
      - "vm/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "README.md"
      - "AGENTS.md"
      - "OWNER_MANUAL.md"
      - "DEVELOPER_OPERATING_SYSTEM.md"
      - ".github/copilot-instructions.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "apps/**"
      - "docs/**"
      - "scripts/**"
      - "vm/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "README.md"
      - "AGENTS.md"
      - "OWNER_MANUAL.md"
      - "DEVELOPER_OPERATING_SYSTEM.md"
      - ".github/copilot-instructions.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exosuit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript Glove and Field validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required project surface
        shell: bash
        run: |
          set -euo pipefail
          required=(
            package.json
            package-lock.json
            tsconfig.json
            scripts/validate-repository.mjs
            scripts/validate-master-plan.mjs
            scripts/validate-field.mjs
            scripts/generate-sbom.mjs
            src/fieldContracts.ts
            src/fieldChannel.ts
            src/fieldHeartbeat.ts
            src/fieldBootstrap.ts
            src/fieldCommand.ts
            src/teachRecorder.ts
            src/visualRetention.ts
            src/fieldRecovery.ts
            src/fieldAdminAuthority.ts
            src/fieldSupportBundle.ts
            src/personaBehavior.ts
            src/personaProfileVault.ts
            src/personaGovernanceStore.ts
            src/personaDerivation.ts
            src/personalBehaviorModels.ts
            src/languageAttentionModels.ts
            src/personaModelBundle.ts
            src/personaModelStore.ts
            src/shadowIsolation.ts
            src/assistedMode.ts
            src/credentialBroker.ts
            tests/personaBehavior.test.ts
            tests/personaProfileVault.test.ts
            tests/personaGovernanceStore.test.ts
            tests/personaDerivation.test.ts
            tests/personalBehaviorModels.test.ts
            tests/languageAttentionModels.test.ts
            tests/personaModelBundle.test.ts
            tests/personaModelStore.test.ts
            tests/safeModeBoundaries.test.ts
            tests/sbomGenerator.test.ts
            tests/fieldSystemPulse.test.ts
            tests/windowsFieldScripts.test.ts
            tests/fixtures/field-contract-v1.json
            tests/fixtures/field-channel-v1.json
          )
          for path in "${required[@]}"; do test -s "$path" || { echo "Missing required artifact: $path"; exit 1; }; done
      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --fund=false
      - name: Generate deterministic npm SBOM
        shell: bash
        run: |
          set -o pipefail
          node scripts/generate-sbom.mjs \
            --output exosuit-npm-sbom.cdx.json \
            --commit "$(git rev-parse HEAD)" \
            --timestamp "$(git show -s --format=%cI HEAD)" 2>&1 | tee sbom.log
      - name: Repository contract
        shell: bash
        run: |
          set -o pipefail
          npm run validate:repository 2>&1 | tee repository-contract.log
      - name: Complete master plan contract
        shell: bash
        run: |
          set -o pipefail
          npm run validate:plan 2>&1 | tee master-plan.log
      - name: Field contract and script invariants
        shell: bash
        run: |
          set -o pipefail
          npm run validate:field-contract 2>&1 | tee field-contract.log
      - name: Strict TypeScript typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Focused Field unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:field -- --reporter=verbose 2>&1 | tee field-tests.log
      - name: Full fake Field system pulse
        shell: bash
        run: |
          set -o pipefail
          npm run test:field-pulse -- --reporter=verbose 2>&1 | tee field-pulse.log
      - name: Full TypeScript test suite
        shell: bash
        run: |
          set -o pipefail
          npm test -- --reporter=verbose 2>&1 | tee typescript-tests.log
      - name: Production TypeScript build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee typescript-build.log
      - name: Existing Glove system pulse
        shell: bash
        run: |
          set -o pipefail
          npm run test:pulse -- --reporter=verbose 2>&1 | tee glove-pulse.log
      - name: Upload TypeScript and Field evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-field-validation
          path: |
            exosuit-npm-sbom.cdx.json
            sbom.log
            repository-contract.log
            master-plan.log
            field-contract.log
            typecheck.log
            field-tests.log
            field-pulse.log
            typescript-tests.log
            typescript-build.log
            glove-pulse.log
          if-no-files-found: warn
          retention-days: 14

  windows-agent:
    name: Windows agent and Field cross-language validation
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify Windows Field source and fixtures
        shell: pwsh
        run: |
          $required = @(
            'apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj',
            'apps/windows-agent/FieldFoundation.cs',
            'apps/windows-agent/FieldChannelFoundation.cs',
            'apps/windows-agent.Tests/FieldFoundationTests.cs',
            'apps/windows-agent.Tests/FieldChannelFoundationTests.cs',
            'apps/windows-agent.Tests/FieldWireContractTests.cs',
            'apps/windows-agent.Tests/FieldChannelWireContractTests.cs',
            'tests/fixtures/field-contract-v1.json',
            'tests/fixtures/field-channel-v1.json',
            'scripts/windows/Test-ExosuitFieldHost.ps1',
            'scripts/windows/Show-ExosuitFieldProvisioningPlan.ps1',
            'scripts/windows/Invoke-ExosuitFieldProvisioning.ps1',
            'scripts/windows/Remove-ExosuitFieldGeneration.ps1',
            'scripts/windows/Initialize-ExosuitFieldGuest.ps1',
            'scripts/windows/Invoke-ExosuitFieldValidation.ps1'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required Windows Field artifact is missing: $path" }
          }
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              $errors += $parseErrors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($errors.Count -gt 0) { $errors | Tee-Object powershell-parse.log; throw 'PowerShell parse errors found.' }
          'PowerShell parse validation passed.' | Tee-Object powershell-parse.log
      - name: Restore .NET tests
        run: dotnet restore apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj
      - name: Build with warnings as errors
        shell: pwsh
        run: |
          dotnet build apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj --configuration Release --no-restore -warnaserror *> windows-build.log
          $exitCode = $LASTEXITCODE
          Get-Content windows-build.log
          exit $exitCode
      - name: Run .NET tests and coverage
        run: dotnet test apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=windows-agent.trx" --collect:"XPlat Code Coverage"
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-field-validation
          path: |
            powershell-parse.log
            windows-build.log
            **/TestResults/**
          if-no-files-found: warn
          retention-days: 14

  repository-contract:
    name: Required manuals, audits, and operational controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify serious-repository manual contract
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            AGENTS.md
            OWNER_MANUAL.md
            DEVELOPER_OPERATING_SYSTEM.md
            docs/MASTER_SYSTEM_ROADMAP.md
            docs/ARCHITECTURE.md
            docs/SECURITY_MODEL.md
            docs/TEST_PLAN.md
            docs/GLOVE_FIELD_BOUNDARY.md
            docs/FIELD_ARCHITECTURE.md
            docs/FIELD_IMPLEMENTATION_STATUS.md
            docs/FIELD_OWNER_MANUAL.md
            docs/FIELD_DEVELOPER_MANUAL.md
            docs/FIELD_TEST_PLAN.md
            docs/FIELD_WINDOWS_RUNBOOK.md
            docs/PERSONA_BEHAVIORAL_DYNAMICS.md
            docs/PERSONA_MODEL_LIFECYCLE.md
            docs/qa/MASTER_PLAN_COVERAGE_MATRIX.md
            docs/qa/PRODUCTION_READINESS_ASSESSMENT_2026-07-22.md
            docs/qa/FIELD_THREAT_MODEL.md
            docs/qa/FIELD_FAILURE_INJECTION_MATRIX.md
            docs/qa/GLOVE_FIELD_PARTS_TRACEABILITY.md
            docs/qa/ATOMIC_AUDIT_2026-07-21_GLOVE_FIELD_FOUNDATION.md
            docs/qa/ATOMIC_AUDIT_2026-07-21_FIELD_FOUNDATION_EXPANSION.md
            docs/qa/ATOMIC_AUDIT_2026-07-22_COMPLETE_MASTER_PLAN.md
            docs/qa/ATOMIC_AUDIT_2026-08-03_PERSONA_BEHAVIOR_FOUNDATION.md
            docs/qa/ATOMIC_AUDIT_2026-08-04_PERSONA_OPERATIONAL_FOUNDATIONS.md
            docs/engineering_log/2026-08-03-persona-behavior-foundation.md
            docs/engineering_log/2026-08-04-persona-operational-foundations.md
            vm/field-host-config.example.json
          )
          for path in "${required[@]}"; do test -s "$path" || { echo "Missing or empty required file: $path"; exit 1; }; done
          # This focused test intentionally contains synthetic secret-shaped strings to
          # prove that privacy-safe support bundles reject them. The source/config scan
          # remains active for every other non-Markdown file.
          ! grep -RInE '(sk-[A-Za-z0-9_-]{20,}|Bearer[[:space:]]+[A-Za-z0-9._~+/-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' \
            --exclude-dir=.git --exclude='*.md' --exclude='supportBundle.test.ts' . || {
              echo 'Potential committed secret shape detected outside documentation.'
              exit 1
            }
          echo 'Repository manual and secret-shape contract passed.'
