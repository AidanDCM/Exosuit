name: Exosuit CI

on:
  push:
    branches: [main, "build/**", "agent/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "apps/**"
      - "docs/**"
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "README.md"
      - "AGENTS.md"
      - "OWNER_MANUAL.md"
      - "DEVELOPER_OPERATING_SYSTEM.md"
      - ".github/copilot-instructions.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "apps/**"
      - "docs/**"
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "README.md"
      - "AGENTS.md"
      - "OWNER_MANUAL.md"
      - "DEVELOPER_OPERATING_SYSTEM.md"
      - ".github/copilot-instructions.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exosuit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript contracts, gateway, and pulse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify TypeScript project surface
        shell: bash
        run: |
          required=(
            package.json
            tsconfig.json
            src/fieldManager.ts
            tests/fieldManager.test.ts
            src/fieldProvisioningPlan.ts
            tests/fieldProvisioningPlan.test.ts
            src/encryptedDemonstrationStore.ts
            tests/encryptedDemonstrationStore.test.ts
            src/fieldScene.ts
            tests/fieldScene.test.ts
            src/shadowLearning.ts
            tests/shadowLearning.test.ts
            src/fieldPathScope.ts
            tests/fieldPathScope.test.ts
            src/fieldArtifactBroker.ts
            tests/fieldArtifactBroker.test.ts
            tests/fixtures/field-contract-v1.json
            tests/fieldWireContract.test.ts
          )
          for path in "${required[@]}"; do test -f "$path" || exit 1; done
      - name: Install dependencies
        run: npm install --ignore-scripts --fund=false
      - name: Repository safety validation
        run: npm run validate:repository
      - name: Typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          exit_code=$?
          cat typecheck.log
          exit "$exit_code"
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: typecheck.log
          if-no-files-found: warn
          retention-days: 14
      - name: Unit and integration tests
        run: npm test -- --reporter=verbose
      - name: Build
        run: npm run build
      - name: Full-chain system pulse
        run: npm run test:pulse -- --reporter=verbose

  windows-agent:
    name: Windows agent build and pure tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify .NET project surface
        shell: pwsh
        run: |
          $required = @(
            'apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj',
            'apps/windows-agent/FieldFoundation.cs',
            'apps/windows-agent.Tests/FieldFoundationTests.cs',
            'apps/windows-agent.Tests/FieldWireContractTests.cs',
            'tests/fixtures/field-contract-v1.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required Windows Field artifact is missing: $path" }
          }
      - name: Restore
        run: dotnet restore apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj
      - name: Build with warnings as errors
        shell: pwsh
        run: |
          dotnet build apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj --configuration Release --no-restore -warnaserror *> windows-build.log
          $exitCode = $LASTEXITCODE
          Get-Content windows-build.log
          exit $exitCode
      - name: Upload Windows build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: windows-build.log
          if-no-files-found: warn
          retention-days: 14
      - name: Test
        run: dotnet test apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=windows-agent.trx" --collect:"XPlat Code Coverage"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-agent-test-results
          path: "**/TestResults/**"
          if-no-files-found: warn
          retention-days: 14

  repository-contract:
    name: Required manuals and safety files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify serious-repo contract
        shell: bash
        run: |
          validate_contract() {
            set -euo pipefail
            required=(
              README.md
              AGENTS.md
              OWNER_MANUAL.md
              DEVELOPER_OPERATING_SYSTEM.md
              docs/MASTER_SYSTEM_ROADMAP.md
              docs/ARCHITECTURE.md
              docs/SECURITY_MODEL.md
              docs/TEST_PLAN.md
              docs/GLOVE_FIELD_BOUNDARY.md
              docs/FIELD_ARCHITECTURE.md
              docs/FIELD_IMPLEMENTATION_STATUS.md
              docs/FIELD_OWNER_MANUAL.md
              docs/FIELD_DEVELOPER_MANUAL.md
              docs/FIELD_TEST_PLAN.md
              docs/PARTS_REUSE_ADR.md
              docs/CODEX_HANDOFF.md
              docs/qa/ATOMIC_AUDIT_BASELINE.md
              docs/qa/PARTS_AND_DONOR_TRACEABILITY.md
              docs/qa/GLOVE_FIELD_PARTS_TRACEABILITY.md
              docs/qa/ATOMIC_AUDIT_2026-07-21_GLOVE_FIELD_FOUNDATION.md
              docs/qa/ATOMIC_AUDIT_2026-07-21_FIELD_FOUNDATION_EXPANSION.md
              docs/engineering_log/2026-07-21-glove-field-foundation.md
              docs/engineering_log/2026-07-21-field-foundation-expansion.md
              docs/logs/ISSUE_AND_SOLUTION_LOG.md
              docs/logs/DECISION_LOG.md
              docs/logs/CHANGELOG_INTERNAL.md
              src/fieldContracts.ts
              src/fieldRegistry.ts
              src/demonstration.ts
              src/encryptedDemonstrationStore.ts
              src/fieldManager.ts
              src/fieldProvisioningPlan.ts
              src/fieldScene.ts
              src/shadowLearning.ts
              src/fieldPathScope.ts
              src/fieldArtifactBroker.ts
              tests/fieldContracts.test.ts
              tests/fieldRegistry.test.ts
              tests/demonstration.test.ts
              tests/encryptedDemonstrationStore.test.ts
              tests/fieldManager.test.ts
              tests/fieldProvisioningPlan.test.ts
              tests/fieldScene.test.ts
              tests/shadowLearning.test.ts
              tests/fieldPathScope.test.ts
              tests/fieldArtifactBroker.test.ts
              tests/fixtures/field-contract-v1.json
              tests/fieldWireContract.test.ts
              apps/windows-agent/FieldFoundation.cs
              apps/windows-agent.Tests/FieldFoundationTests.cs
              apps/windows-agent.Tests/FieldWireContractTests.cs
              .github/copilot-instructions.md
              .github/pull_request_template.md
            )
            for path in "${required[@]}"; do
              test -s "$path" || { echo "Missing or empty required file: $path"; return 1; }
            done
            ! grep -RInE '(sk-[A-Za-z0-9_-]{20,}|Bearer[[:space:]]+[A-Za-z0-9._~+/-]{20,})' \
              --exclude-dir=.git --exclude='*.md' . || {
                echo 'Potential committed secret shape detected outside documentation.'
                return 1
              }
          }
          set +e
          validate_contract > repository-contract.log 2>&1
          exit_code=$?
          cat repository-contract.log
          exit "$exit_code"
      - name: Upload repository-contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-contract-diagnostics
          path: repository-contract.log
          if-no-files-found: warn
          retention-days: 14
