name: SCN-001 sequence race fix

on:
  push:
    branches:
      - codex/scn001-authenticated-scene-channel

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/scn001-authenticated-scene-channel
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Patch allocator and regression test
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          runtime_path = Path('apps/windows-agent/FieldKvpRuntime.cs')
          text = runtime_path.read_text(encoding='utf-8')
          needle = '    private static readonly JsonSerializerOptions WireJson = CreateWireJson();\n'
          replacement = needle + '    // Heartbeat/control emission and the scene relay share this allocator from separate tasks.\n    // The persisted file is crash durability, not a concurrency primitive; serialize the complete\n    // read-increment-replace transaction so one process can never issue the same sequence twice.\n    private static readonly object GuestSequenceAllocationLock = new();\n'
          if needle not in text:
              raise SystemExit('WireJson anchor not found')
          text = text.replace(needle, replacement, 1)

          old = '''    internal static long ReserveNextGuestSequence(
        FieldKvpRuntimeConfiguration configuration,
        DateTimeOffset? now = null)
    {
        ValidateConfiguration(configuration);
        var directory = Path.GetDirectoryName(Path.GetFullPath(configuration.SecretPath))
            ?? throw new InvalidOperationException("Field guest secret path has no parent directory.");
        var path = Path.Combine(directory, "guest-sequence.json");
        var next = checked((now ?? DateTimeOffset.UtcNow).ToUnixTimeMilliseconds() * 1_000);
        if (File.Exists(path))
        {
            var state = JsonSerializer.Deserialize<GuestSequenceState>(File.ReadAllText(path), WireJson)
                ?? throw new InvalidOperationException("Field guest sequence state is empty.");
            if (state.ContractVersion != 1 ||
                state.Field != configuration.Field ||
                !string.Equals(state.KeyId, configuration.KeyId, StringComparison.Ordinal) ||
                state.NextSequence < 0 ||
                state.NextSequence > MaximumSafeWireSequence)
            {
                throw new InvalidOperationException("Field guest sequence state is invalid or belongs to another channel.");
            }
            next = state.NextSequence;
        }
        if (next >= MaximumSafeWireSequence)
        {
            throw new InvalidOperationException("Field guest sequence space is exhausted.");
        }
        Directory.CreateDirectory(directory);
        var updated = new GuestSequenceState(1, configuration.Field, configuration.KeyId, next + 1);
        var temporary = $"{path}.{Environment.ProcessId}.{Guid.NewGuid():N}.tmp";
        try
        {
            WriteDurableState(temporary, JsonSerializer.Serialize(updated, WireJson));
            File.Move(temporary, path, overwrite: true);
        }
        finally
        {
            if (File.Exists(temporary)) File.Delete(temporary);
        }
        return next;
    }
'''
          new = '''    internal static long ReserveNextGuestSequence(
        FieldKvpRuntimeConfiguration configuration,
        DateTimeOffset? now = null)
    {
        ValidateConfiguration(configuration);
        lock (GuestSequenceAllocationLock)
        {
            var directory = Path.GetDirectoryName(Path.GetFullPath(configuration.SecretPath))
                ?? throw new InvalidOperationException("Field guest secret path has no parent directory.");
            var path = Path.Combine(directory, "guest-sequence.json");
            var next = checked((now ?? DateTimeOffset.UtcNow).ToUnixTimeMilliseconds() * 1_000);
            if (File.Exists(path))
            {
                var state = JsonSerializer.Deserialize<GuestSequenceState>(File.ReadAllText(path), WireJson)
                    ?? throw new InvalidOperationException("Field guest sequence state is empty.");
                if (state.ContractVersion != 1 ||
                    state.Field != configuration.Field ||
                    !string.Equals(state.KeyId, configuration.KeyId, StringComparison.Ordinal) ||
                    state.NextSequence < 0 ||
                    state.NextSequence > MaximumSafeWireSequence)
                {
                    throw new InvalidOperationException("Field guest sequence state is invalid or belongs to another channel.");
                }
                next = state.NextSequence;
            }
            if (next >= MaximumSafeWireSequence)
            {
                throw new InvalidOperationException("Field guest sequence space is exhausted.");
            }
            Directory.CreateDirectory(directory);
            var updated = new GuestSequenceState(1, configuration.Field, configuration.KeyId, next + 1);
            var temporary = $"{path}.{Environment.ProcessId}.{Guid.NewGuid():N}.tmp";
            try
            {
                WriteDurableState(temporary, JsonSerializer.Serialize(updated, WireJson));
                File.Move(temporary, path, overwrite: true);
            }
            finally
            {
                if (File.Exists(temporary)) File.Delete(temporary);
            }
            return next;
        }
    }
'''
          if old not in text:
              raise SystemExit('ReserveNextGuestSequence anchor not found')
          runtime_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('apps/windows-agent.Tests/FieldKvpRuntimeTests.cs')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '''    [Fact]
    public void ObservationSnapshotProtectsStateAndRejectsRegressionMutationReuseCorruptionRotationAndStaleGeneration()
'''
          test = '''    [Fact]
    public void GuestSequenceAllocationsAreSerializedAcrossConcurrentWriters()
    {
        var root = Path.Combine(Path.GetTempPath(), $"exosuit-kvp-sequence-concurrent-{Guid.NewGuid():N}");
        Directory.CreateDirectory(root);
        try
        {
            var configuration = new FieldKvpRuntimeConfiguration(
                1,
                new FieldReference(Guid.NewGuid(), 9),
                "field-agent-test",
                "field-key-test",
                Path.Combine(root, "secret.txt"),
                Path.Combine(root, "bootstrap.json"),
                1_000);
            var now = DateTimeOffset.Parse("2026-09-15T21:00:00.000Z");
            using var start = new ManualResetEventSlim(false);
            var tasks = Enumerable.Range(0, 32)
                .Select(_ => Task.Run(() =>
                {
                    start.Wait();
                    return FieldKvpRuntime.ReserveNextGuestSequence(configuration, now);
                }))
                .ToArray();

            start.Set();
            var sequences = Task.WhenAll(tasks).GetAwaiter().GetResult();
            Array.Sort(sequences);

            Assert.Equal(32, sequences.Distinct().Count());
            for (var index = 1; index < sequences.Length; index++)
                Assert.Equal(sequences[index - 1] + 1, sequences[index]);
        }
        finally
        {
            if (Directory.Exists(root)) Directory.Delete(root, recursive: true);
        }
    }

'''
          if anchor not in tests:
              raise SystemExit('FieldKvpRuntimeTests anchor not found')
          test_path.write_text(tests.replace(anchor, test + anchor, 1), encoding='utf-8')
          '@ | python -
      - name: Build and test Windows agent
        shell: pwsh
        run: |
          dotnet test apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj --configuration Release
      - name: Commit verified fix and remove one-shot workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/scn001-sequence-race-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-agent/FieldKvpRuntime.cs apps/windows-agent.Tests/FieldKvpRuntimeTests.cs .github/workflows/scn001-sequence-race-fix.yml
          git commit -m "fix(field): serialize guest channel sequence allocation"
          git push origin HEAD:codex/scn001-authenticated-scene-channel
