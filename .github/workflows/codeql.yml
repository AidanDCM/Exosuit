name: Security Audit

# See the trigger note in ci.yml. `push` covered `build/**` as well as `main`, so every
# push to the canonical branch ran these audits twice for the same commit — once for the
# push and once through PR #1.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "apps/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/codeql.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "apps/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: npm dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify TypeScript project surface
        run: test -f package.json
      - name: Resolve dependency tree without scripts
        run: npm install --ignore-scripts --fund=false
      - name: Fail on high or critical advisories
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          exit_code=$?
          cat npm-audit.json
          exit "$exit_code"
      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14

  nuget-audit:
    name: NuGet dependency vulnerability audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify .NET project surface
        shell: pwsh
        run: |
          if (-not (Test-Path 'apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj')) {
            throw 'Windows agent test project is missing.'
          }
      - name: Restore with NuGet audit enabled
        run: dotnet restore apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj -p:NuGetAudit=true
      - name: List vulnerable direct and transitive packages
        shell: pwsh
        run: |
          $output = dotnet list apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj package --vulnerable --include-transitive
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath nuget-vulnerability-audit.txt
          if ($exitCode -ne 0) { exit $exitCode }
          if (($output -join "`n") -match 'has the following vulnerable packages') {
            Write-Error 'NuGet reported one or more known vulnerable packages.'
            exit 1
          }
      - name: Upload NuGet audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-audit-report
          path: nuget-vulnerability-audit.txt
          if-no-files-found: warn
          retention-days: 14

  codeql-javascript-typescript:
    name: CodeQL JavaScript/TypeScript (public repositories only)
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3

  codeql-csharp:
    name: CodeQL C# (public repositories only)
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - name: Restore and build
        run: |
          dotnet restore apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj
          dotnet build apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj --configuration Release --no-restore
      - uses: github/codeql-action/analyze@v3
