name: CodeQL

on:
  push:
    branches: [main, "build/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "apps/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "apps/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  detect:
    name: Detect project surfaces
    runs-on: ubuntu-latest
    outputs:
      has_typescript: ${{ steps.files.outputs.has_typescript }}
      has_dotnet: ${{ steps.files.outputs.has_dotnet }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        shell: bash
        run: |
          test -f package.json && echo 'has_typescript=true' >> "$GITHUB_OUTPUT" || echo 'has_typescript=false' >> "$GITHUB_OUTPUT"
          test -f apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj && echo 'has_dotnet=true' >> "$GITHUB_OUTPUT" || echo 'has_dotnet=false' >> "$GITHUB_OUTPUT"

  javascript-typescript:
    name: CodeQL JavaScript/TypeScript
    needs: detect
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3

  csharp:
    name: CodeQL C# Windows agent
    needs: detect
    if: needs.detect.outputs.has_dotnet == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - name: Restore and build
        run: |
          dotnet restore apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj
          dotnet build apps/windows-agent.Tests/Exosuit.Agent.Tests.csproj --configuration Release --no-restore
      - uses: github/codeql-action/analyze@v3
